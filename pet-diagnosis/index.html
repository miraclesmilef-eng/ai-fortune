<title>どうぶつ図鑑診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap">
<style>
  :root {
    --ground: #EEF5EC;
    --surface: #FFFEFA;
    --surface-2: #FFF6E8;
    --ink: #2B3A2F;
    --ink-soft: #5B6B5C;
    --accent: #FF7A59;
    --accent-ink: #7A2E17;
    --accent-2: #F6C445;
    --accent-3: #6E9B7C;
    --line: #D8E6D5;
    --shadow: rgba(43,58,47,0.14);
    --fur-coral: #FFB199;
    --fur-butter: #F6D98A;
    --fur-sage: #A9C9A8;
    --fur-sand: #E3C9A0;
    --fur-cream: #FBEFE4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #141A16;
      --surface: #1E2620;
      --surface-2: #26301F;
      --ink: #F1EFE6;
      --ink-soft: #B7C2B6;
      --accent: #FF8A6B;
      --accent-ink: #FFE3D8;
      --accent-2: #E8BE55;
      --accent-3: #8BB99A;
      --line: #354237;
      --shadow: rgba(0,0,0,0.45);
      --fur-coral: #C97A61;
      --fur-butter: #C9A857;
      --fur-sage: #6E9179;
      --fur-sand: #A9895F;
      --fur-cream: #3A342A;
    }
  }
  :root[data-theme="dark"] {
    --ground: #141A16;
    --surface: #1E2620;
    --surface-2: #26301F;
    --ink: #F1EFE6;
    --ink-soft: #B7C2B6;
    --accent: #FF8A6B;
    --accent-ink: #FFE3D8;
    --accent-2: #E8BE55;
    --accent-3: #8BB99A;
    --line: #354237;
    --shadow: rgba(0,0,0,0.45);
    --fur-coral: #C97A61;
    --fur-butter: #C9A857;
    --fur-sage: #6E9179;
    --fur-sand: #A9895F;
    --fur-cream: #3A342A;
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(10px, 3vw, 24px);
  }

  .stage {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2dvh, 16px);
  }

  .eyebrow {
    font-size: clamp(11px, 2.6vw, 12px);
    letter-spacing: 0.14em;
    color: var(--accent-3);
    font-weight: 700;
  }

  h1.title {
    font-family: "Yomogi", "Zen Maru Gothic", sans-serif;
    font-size: clamp(22px, 6.5vw, 30px);
    margin: 0;
    text-align: center;
    text-wrap: balance;
    color: var(--ink);
  }

  .subtitle {
    margin: 0;
    font-size: clamp(12px, 3vw, 13px);
    color: var(--ink-soft);
    text-align: center;
  }

  /* ---------- Quiz ---------- */
  .quiz-card {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 10px 26px -14px var(--shadow);
    padding: clamp(12px, 3.2vw, 18px);
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.8vw, 12px);
  }

  .question h2 {
    font-family: "Yomogi", "Zen Maru Gothic", sans-serif;
    font-size: clamp(13px, 3.4vw, 15px);
    margin: 0 0 6px;
    color: var(--ink);
    font-weight: 400;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .choice {
    appearance: none;
    border: 1.5px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    border-radius: 12px;
    padding: 7px 7px;
    font-family: inherit;
    font-size: clamp(10.5px, 2.6vw, 11.5px);
    line-height: 1.25;
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .choice:hover { border-color: var(--accent-3); }
  .choice:active { transform: scale(0.96); }
  .choice.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
  }

  .submit-btn {
    appearance: none;
    border: none;
    border-radius: 999px;
    padding: 11px;
    font-family: "Yomogi", sans-serif;
    font-size: clamp(14px, 3.6vw, 16px);
    background: var(--accent-2);
    color: var(--accent-ink);
    cursor: pointer;
    box-shadow: 0 8px 18px -8px var(--shadow);
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .submit-btn:not(:disabled):active { transform: scale(0.97); }

  /* ---------- Result ---------- */
  .result-wrap { width: 100%; display: none; flex-direction: column; align-items: center; gap: 12px; }
  .result-wrap.active { display: flex; }
  .quiz-wrap.hidden { display: none; }

  .card {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--surface);
    border-radius: 26px;
    border: 1px solid var(--line);
    box-shadow: 0 16px 34px -16px var(--shadow);
    padding: clamp(14px, 4.2vw, 20px);
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1.4dvh, 10px);
    overflow: hidden;
    animation: cardIn 0.5s cubic-bezier(.2,.9,.3,1.2) both;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: none; } }

  /* ticket notches */
  .card::before, .card::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 22px;
    height: 22px;
    background: var(--ground);
    border-radius: 50%;
    transform: translateY(-50%);
  }
  .card::before { left: -11px; }
  .card::after { right: -11px; }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .catalog {
    font-weight: 700;
    font-size: clamp(11px, 2.8vw, 12px);
    background: var(--accent-2);
    color: var(--accent-ink);
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.06em;
  }

  .owner-badge {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1.5px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  .owner-badge svg { width: 18px; height: 18px; }

  .art-frame {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .art-circle {
    width: min(46dvh, 62%);
    aspect-ratio: 1/1;
    border-radius: 50%;
    background: var(--surface-2);
    border: 3px dashed var(--line);
    display: flex; align-items: center; justify-content: center;
    padding: 10%;
  }
  .art-circle svg { width: 100%; height: 100%; }
  .art-circle.no-art { flex-direction: column; gap: 4px; }
  .art-circle.no-art .catalog-big {
    font-family: "Yomogi", sans-serif;
    font-size: clamp(28px, 9vw, 40px);
    color: var(--accent-3);
  }
  .art-circle.no-art .paw-row { font-size: 14px; letter-spacing: 4px; color: var(--accent-2); }
  .art-circle.no-art .of-total { font-size: clamp(9px, 2.2vw, 10px); color: var(--ink-soft); }

  .name-block { text-align: center; }
  .name-block .type-name {
    font-family: "Yomogi", sans-serif;
    font-size: clamp(19px, 5.6vw, 24px);
    margin: 0;
    text-wrap: balance;
  }
  .name-block .catch {
    margin: 2px 0 0;
    font-size: clamp(11.5px, 2.9vw, 12.5px);
    color: var(--accent-3);
    font-weight: 700;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: clamp(10px, 3vw, 18px);
  }
  .stat { text-align: center; }
  .stat .label { font-size: clamp(9.5px, 2.4vw, 10.5px); color: var(--ink-soft); display: block; margin-bottom: 2px; }
  .dots { display: inline-flex; gap: 2px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--accent); }

  .desc {
    margin: 0;
    text-align: center;
    font-size: clamp(11px, 2.8vw, 12.5px);
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .divider {
    border: none;
    border-top: 2px dashed var(--line);
    margin: 0;
  }

  .tags {
    margin: 0;
    text-align: center;
    font-size: clamp(10.5px, 2.6vw, 11.5px);
    color: var(--accent-3);
    font-weight: 700;
  }

  .controls {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .gender-toggle {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .gender-toggle button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: clamp(11px, 2.7vw, 12px);
    padding: 6px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  .gender-toggle button.active { background: var(--accent); color: #fff; font-weight: 700; }

  .switch-row {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: clamp(11px, 2.7vw, 12px);
    color: var(--ink-soft);
  }
  .switch {
    width: 34px; height: 20px;
    border-radius: 999px;
    background: var(--line);
    position: relative;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--surface);
    transition: transform 0.18s ease;
  }
  .switch.on { background: var(--accent-3); }
  .switch.on::after { transform: translateX(14px); }

  .retry-btn {
    appearance: none;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 999px;
    padding: 9px 16px;
    font-family: "Yomogi", sans-serif;
    font-size: clamp(13px, 3.4vw, 14px);
    cursor: pointer;
    width: 100%;
  }
  .retry-btn:hover { border-color: var(--accent); }
</style>

<div class="stage">
  <span class="eyebrow">PET COMPATIBILITY FILE</span>
  <h1 class="title">どうぶつ図鑑診断</h1>
  <p class="subtitle">3つの質問で、あなたが飼うべき相棒を診断します</p>

  <div class="quiz-wrap" id="quizWrap">
    <div class="quiz-card">
      <div class="question" id="q1">
        <h2>Q1. 理想の休日は?</h2>
        <div class="choices" data-q="1">
          <button class="choice" data-v="a">家でひとり、静かに過ごす</button>
          <button class="choice" data-v="b">友達とわいわい過ごす</button>
          <button class="choice" data-v="c">予定を詰めず気分で動く</button>
          <button class="choice" data-v="d">やることを片付けてスッキリ</button>
        </div>
      </div>
      <div class="question" id="q2">
        <h2>Q2. 人との距離感は?</h2>
        <div class="choices" data-q="2">
          <button class="choice" data-v="a">べったり甘えたい・甘えられたい</button>
          <button class="choice" data-v="b">一定の距離を保ちつつ仲良く</button>
          <button class="choice" data-v="c">気が向いた時だけ交流したい</button>
          <button class="choice" data-v="d">輪の中心よりも観察するのが好き</button>
        </div>
      </div>
      <div class="question" id="q3">
        <h2>Q3. お世話にかけられる手間は?</h2>
        <div class="choices" data-q="3">
          <button class="choice" data-v="a">こまめなお世話はちょっと苦手</button>
          <button class="choice" data-v="b">基本のお世話なら無理なくできる</button>
          <button class="choice" data-v="c">手をかけるほど愛着が湧くタイプ</button>
          <button class="choice" data-v="d">本格的にじっくり向き合いたい</button>
        </div>
      </div>
      <button class="submit-btn" id="submitBtn" disabled>診断する</button>
    </div>
  </div>

  <div class="result-wrap" id="resultWrap">
    <div class="card" id="card">
      <div class="card-top">
        <span class="catalog" id="catalogNo">No.01 / 16</span>
        <span class="owner-badge" id="ownerBadge"></span>
      </div>
      <div class="art-frame">
        <div class="art-circle" id="artCircle"></div>
      </div>
      <div class="name-block">
        <p class="type-name" id="typeName">マイペース猫さん</p>
        <p class="catch" id="typeCatch">距離感の達人</p>
      </div>
      <div class="stats" id="stats"></div>
      <hr class="divider">
      <p class="desc" id="typeDesc"></p>
      <p class="tags">#どうぶつ図鑑診断 #あなたが飼うべき動物</p>
    </div>

    <div class="controls">
      <div class="gender-toggle" id="genderToggle">
        <button data-g="male">男性</button>
        <button data-g="female">女性</button>
        <button data-g="neutral" class="active">中性的</button>
      </div>
      <div class="switch-row">
        <span>イラスト</span>
        <button class="switch on" id="artSwitch"></button>
      </div>
    </div>
    <button class="retry-btn" id="retryBtn">もう一度診断する</button>
  </div>
</div>

<script>

  const OWNER_ICONS = {
    male: `<svg viewBox="0 0 40 40"><circle cx="20" cy="16" r="9" fill="${ink}"/><path d="M6,36 q14,-16 28,0 z" fill="${ink}"/></svg>`,
    female: `<svg viewBox="0 0 40 40"><path d="M11,14 a9,9 0 0 1 18,0 q1,10 -3,16 l-2,-6 q-5,3 -8,0 l-2,6 q-4,-6 -3,-16" fill="${ink}"/><path d="M5,37 q15,-15 30,0 z" fill="${ink}"/></svg>`,
    neutral: `<svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="8.5" fill="${ink}"/><path d="M13,15 q7,-9 14,0" fill="none" stroke="${ink}" stroke-width="2"/><path d="M7,37 q13,-15 26,0 z" fill="${ink}"/></svg>`
  };

  const SCALE = { a: 1, b: 2, c: 4, d: 5 };

  function nearestAnimalIndex(userVec) {
    let bestIdx = 0;
    let bestDist = Infinity;
    ANIMALS.forEach((animal, i) => {
      const s = animal.stats;
      const dist = Math.abs(s.affection - userVec.affection)
        + Math.abs(s.freedom - userVec.freedom)
        + Math.abs(s.care - userVec.care);
      if (dist < bestDist) { bestDist = dist; bestIdx = i; }
    });
    return bestIdx;
  }

  let answers = { 1: null, 2: null, 3: null };
  let gender = "neutral";
  let showArt = true;
  let currentAnimal = ANIMALS[0];

  document.querySelectorAll(".choices").forEach((group) => {
    const qNum = group.dataset.q;
    group.querySelectorAll(".choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        group.querySelectorAll(".choice").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        answers[qNum] = btn.dataset.v;
        document.getElementById("submitBtn").disabled = !(answers[1] && answers[2] && answers[3]);
      });
    });
  });

  document.getElementById("submitBtn").addEventListener("click", () => {
    const userVec = {
      affection: SCALE[answers[1]],
      freedom: SCALE[answers[2]],
      care: SCALE[answers[3]]
    };
    const idx = nearestAnimalIndex(userVec);
    currentAnimal = ANIMALS[idx];
    renderResult(idx);
    document.getElementById("quizWrap").classList.add("hidden");
    document.getElementById("resultWrap").classList.add("active");
  });

  document.getElementById("retryBtn").addEventListener("click", () => {
    answers = { 1: null, 2: null, 3: null };
    document.querySelectorAll(".choice.selected").forEach((b) => b.classList.remove("selected"));
    document.getElementById("submitBtn").disabled = true;
    document.getElementById("resultWrap").classList.remove("active");
    document.getElementById("quizWrap").classList.remove("hidden");
  });

  document.getElementById("genderToggle").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-g]");
    if (!btn) return;
    gender = btn.dataset.g;
    document.querySelectorAll("#genderToggle button").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("ownerBadge").innerHTML = OWNER_ICONS[gender];
  });

  document.getElementById("artSwitch").addEventListener("click", () => {
    showArt = !showArt;
    document.getElementById("artSwitch").classList.toggle("on", showArt);
    renderArt();
  });

  function dots(n) {
    let out = '<span class="dots">';
    for (let i = 1; i <= 5; i++) out += `<span class="dot ${i <= n ? "on" : ""}"></span>`;
    return out + "</span>";
  }

  function renderArt() {
    const el = document.getElementById("artCircle");
    if (showArt) {
      el.classList.remove("no-art");
      el.innerHTML = currentAnimal.svg;
    } else {
      el.classList.add("no-art");
      el.innerHTML = `<span class="catalog-big">No.${String(ANIMALS.indexOf(currentAnimal) + 1).padStart(2, "0")}</span><span class="paw-row">🐾 🐾 🐾</span><span class="of-total">/ ${ANIMALS.length}</span>`;
    }
  }

  function renderResult(idx) {
    document.getElementById("catalogNo").textContent = `No.${String(idx + 1).padStart(2, "0")} / ${ANIMALS.length}`;
    document.getElementById("typeName").textContent = currentAnimal.name;
    document.getElementById("typeCatch").textContent = currentAnimal.catch;
    document.getElementById("typeDesc").textContent = currentAnimal.desc;
    document.getElementById("ownerBadge").innerHTML = OWNER_ICONS[gender];
    document.getElementById("stats").innerHTML = `
      <div class="stat"><span class="label">なつき度</span>${dots(currentAnimal.stats.affection)}</div>
      <div class="stat"><span class="label">自由さ</span>${dots(currentAnimal.stats.freedom)}</div>
      <div class="stat"><span class="label">お世話らくらく度</span>${dots(currentAnimal.stats.care)}</div>
    `;
    renderArt();
  }
